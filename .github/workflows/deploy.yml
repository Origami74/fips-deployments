name: Deploy FIPS Nodes

# Builds the fips binary from TWO source branches of the fips repo (master and
# next), packages each into its own Docker image, and deploys both side by side
# on every server in the host matrix:
#
#   master → container fips-node       UDP 2121 / TCP 443  TUN fips0  (dns + iperf + http)
#   next   → container fips-node-next  UDP 2122 / TCP 444  TUN fips1  (fips only, dns off)
#
# Both containers run with --network host, so the next instance offsets every
# public port by +1 and skips the auxiliary services (dnsmasq, the fips daemon
# DNS resolver, iperf3, http.server) that would otherwise collide on the shared
# host network namespace. The two instances reuse the SAME per-host nsec; `next`
# defaults its Nostr discovery namespace to `fips-overlay-v1-next`, so the two
# protocol versions stay on separate overlays despite sharing an identity.
#
# Triggers:
#   - push to master       → ALWAYS builds + deploys both variants (cache bypassed)
#   - workflow_dispatch    → ALWAYS builds + deploys both variants (cache bypassed)
#   - schedule (hourly)    → polls jmcorgan/fips master AND next independently;
#                            deploys only the variant(s) whose SHA changed since
#                            the last successful deploy. master changing does not
#                            redeploy next, and vice versa.

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        type: choice
        options:
          - production
          - staging
        default: production
        required: true

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: fips-node
  FIPS_REPO: jmcorgan/fips

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 – Resolve master & next to SHAs and plan which variants to deploy
  #
  # Each branch has its own deployment marker cache (fips-deployed-<variant>-<sha>).
  # On schedule a variant deploys only on a marker miss (new SHA); push and
  # workflow_dispatch force both (cache bypassed). The job emits two dynamic
  # matrices consumed by the build and deploy jobs:
  #   build_matrix : [{variant,branch,sha}, ...]  — one per variant to (re)build
  #   deploy_matrix: [{name,variant}, ...]         — host × variant cross product
  # An empty matrix ('[]') skips the corresponding job (no-op schedule run).
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve & plan
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      deploy_matrix: ${{ steps.plan.outputs.deploy_matrix }}
    steps:
      - name: Resolve master & next to commit SHAs
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MASTER_SHA=$(gh api "repos/${FIPS_REPO}/commits/master" -q .sha)
          NEXT_SHA=$(gh api "repos/${FIPS_REPO}/commits/next" -q .sha)
          echo "master_sha=${MASTER_SHA}" >> "$GITHUB_OUTPUT"
          echo "next_sha=${NEXT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${FIPS_REPO}@master → ${MASTER_SHA}"
          echo "Resolved ${FIPS_REPO}@next   → ${NEXT_SHA}"

      - name: Check master deployment marker
        id: cache_master
        uses: actions/cache/restore@v5
        with:
          path: .deployed-marker
          key: fips-deployed-master-${{ steps.sha.outputs.master_sha }}
          lookup-only: true

      - name: Check next deployment marker
        id: cache_next
        uses: actions/cache/restore@v5
        with:
          path: .deployed-marker
          key: fips-deployed-next-${{ steps.sha.outputs.next_sha }}
          lookup-only: true

      - name: Plan build & deploy matrices
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          MASTER_SHA: ${{ steps.sha.outputs.master_sha }}
          NEXT_SHA: ${{ steps.sha.outputs.next_sha }}
          MASTER_HIT: ${{ steps.cache_master.outputs.cache-hit }}
          NEXT_HIT: ${{ steps.cache_next.outputs.cache-hit }}
        run: |
          # Hosts that every active variant is deployed to.
          HOSTS=(FIPS_PROD_US_1 FIPS_PROD_US_2)

          # Decide per branch. push/workflow_dispatch force both (cache
          # bypassed); schedule deploys a branch only when its SHA is new.
          case "$EVENT" in
            workflow_dispatch|push)
              deploy_master=true; deploy_next=true
              echo "$EVENT — forcing both variants (cache bypassed)" ;;
            *)
              [ "$MASTER_HIT" = "true" ] && deploy_master=false || deploy_master=true
              [ "$NEXT_HIT"   = "true" ] && deploy_next=false   || deploy_next=true
              echo "schedule — deploy master:${deploy_master} next:${deploy_next}" ;;
          esac

          build='[]'
          deploy='[]'
          if [ "$deploy_master" = true ]; then
            build=$(jq -c --arg s "$MASTER_SHA" '. += [{variant:"master",branch:"master",sha:$s}]' <<<"$build")
          fi
          if [ "$deploy_next" = true ]; then
            build=$(jq -c --arg s "$NEXT_SHA" '. += [{variant:"next",branch:"next",sha:$s}]' <<<"$build")
          fi
          for h in "${HOSTS[@]}"; do
            [ "$deploy_master" = true ] && deploy=$(jq -c --arg n "$h" '. += [{name:$n,variant:"master"}]' <<<"$deploy")
            [ "$deploy_next"   = true ] && deploy=$(jq -c --arg n "$h" '. += [{name:$n,variant:"next"}]' <<<"$deploy")
          done

          echo "build_matrix=$build"   >> "$GITHUB_OUTPUT"
          echo "deploy_matrix=$deploy" >> "$GITHUB_OUTPUT"
          echo "build_matrix=$build"
          echo "deploy_matrix=$deploy"

  # ---------------------------------------------------------------------------
  # Job 2 – Build each active variant: check out fips at the resolved SHA,
  # build the binary, build the Docker image (tagged fips-node:<variant>).
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.sha }})
    # Pinned to 22.04 (glibc 2.35) so binaries run on debian:bookworm-slim
    # (glibc 2.36). ubuntu-latest = 24.04 produces binaries linked against
    # glibc 2.39 which won't load in the runtime image.
    runs-on: ubuntu-22.04
    needs: resolve
    if: needs.resolve.outputs.build_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}
    steps:
      - name: Check out fips source (${{ matrix.branch }} @ ${{ matrix.sha }})
        uses: actions/checkout@v6
        with:
          repository: ${{ env.FIPS_REPO }}
          ref: ${{ matrix.sha }}
          path: fips-src

      - name: Check out fips-deployments (this repo) for the Dockerfile
        uses: actions/checkout@v6
        with:
          path: fips-deployments

      - name: Install build system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fips-src/target
          key: ${{ runner.os }}-cargo-${{ matrix.variant }}-${{ hashFiles('fips-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.variant }}-
            ${{ runner.os }}-cargo-

      - name: Build FIPS binary
        run: cargo build --release
        working-directory: fips-src

      - name: Stage binaries into Docker build context
        run: |
          cp fips-src/target/release/fips    fips-deployments/docker/fips
          cp fips-src/target/release/fipsctl fips-deployments/docker/fipsctl
          cp fips-src/target/release/fipstop fips-deployments/docker/fipstop

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t ${{ env.IMAGE_NAME }}:${{ matrix.variant }} fips-deployments/docker

      - name: Save Docker image as tarball
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ matrix.variant }} | gzip > /tmp/fips-node.tar.gz
          ls -lh /tmp/fips-node.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ matrix.variant }}
          path: /tmp/fips-node.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 3 – Deploy each (host × variant) pair.
  #
  # GitHub Actions does not allow dynamic secret/var lookup
  # (${{ secrets[matrix.x] }}). The "Resolve target" step works around this
  # by exposing all per-server secrets/vars as job-level env, then a case
  # statement keyed on matrix.name promotes the right ones into $GITHUB_ENV
  # under the names DEPLOY_HOST / DEPLOY_USER / NSEC_VALUE. The same nsec is
  # reused for both variants on a host. A second case (keyed on matrix.variant)
  # sets the variant-specific ports / container name / TUN / entrypoint mode.
  #
  # Required (under environment "production"), per server:
  #   secrets:
  #     SSH_PRIVATE_KEY              — shared SSH private key
  #     NSEC_FIPS_PROD_US_<N>        — 64-char hex nsec (shared by both variants)
  #   vars:
  #     DEPLOY_USER_FIPS_PROD_US_<N> — SSH login user
  #     DEPLOY_HOST_FIPS_PROD_US_<N> — public IP (must be a literal IP, not a hostname)
  #
  # Adding a new server:
  #   1. Add the host id to HOSTS in the "Plan" step above.
  #   2. Add the three new vars/secret in GitHub.
  #   3. Add a case branch in "Resolve target".
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy ${{ matrix.variant }} → ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [resolve, build]
    if: needs.resolve.outputs.deploy_matrix != '[]'
    environment: ${{ inputs.environment || 'production' }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.deploy_matrix) }}

    steps:
      - name: Resolve target (pick host/user/nsec for ${{ matrix.name }})
        env:
          HOST_1: ${{ vars.DEPLOY_HOST_FIPS_PROD_US_1 }}
          HOST_2: ${{ vars.DEPLOY_HOST_FIPS_PROD_US_2 }}
          USER_1: ${{ vars.DEPLOY_USER_FIPS_PROD_US_1 }}
          USER_2: ${{ vars.DEPLOY_USER_FIPS_PROD_US_2 }}
          NSEC_1: ${{ secrets.NSEC_FIPS_PROD_US_1 }}
          NSEC_2: ${{ secrets.NSEC_FIPS_PROD_US_2 }}
        run: |
          case "${{ matrix.name }}" in
            FIPS_PROD_US_1)
              host="$HOST_1"; user="$USER_1"; nsec="$NSEC_1"
              host_var="DEPLOY_HOST_FIPS_PROD_US_1"
              user_var="DEPLOY_USER_FIPS_PROD_US_1"
              nsec_secret="NSEC_FIPS_PROD_US_1"
              ;;
            FIPS_PROD_US_2)
              host="$HOST_2"; user="$USER_2"; nsec="$NSEC_2"
              host_var="DEPLOY_HOST_FIPS_PROD_US_2"
              user_var="DEPLOY_USER_FIPS_PROD_US_2"
              nsec_secret="NSEC_FIPS_PROD_US_2"
              ;;
            *)
              echo "::error::Unknown matrix entry: ${{ matrix.name }}"; exit 1 ;;
          esac
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$user" >> "$GITHUB_ENV"
          echo "::add-mask::$nsec"
          echo "NSEC_VALUE=$nsec" >> "$GITHUB_ENV"
          # Expose the names of the missing config keys so the next step can
          # name them in error messages.
          echo "HOST_VAR=$host_var" >> "$GITHUB_ENV"
          echo "USER_VAR=$user_var" >> "$GITHUB_ENV"
          echo "NSEC_SECRET=$nsec_secret" >> "$GITHUB_ENV"

      - name: Resolve variant params (${{ matrix.variant }})
        run: |
          case "${{ matrix.variant }}" in
            master)
              echo "IMAGE_TAG=master"            >> "$GITHUB_ENV"
              echo "CONTAINER_NAME=fips-node"     >> "$GITHUB_ENV"
              echo "UDP_PORT=2121"                >> "$GITHUB_ENV"
              echo "TCP_PORT=443"                 >> "$GITHUB_ENV"
              echo "TUN_NAME=fips0"               >> "$GITHUB_ENV"
              echo "DNS_ENABLED=true"             >> "$GITHUB_ENV"
              echo "ENTRYPOINT_MODE=default"      >> "$GITHUB_ENV"
              ;;
            next)
              # +1 on every public port; distinct TUN; fips' own DNS resolver
              # disabled and the image's auxiliary services skipped so the two
              # containers don't collide on the shared --network host stack.
              echo "IMAGE_TAG=next"                >> "$GITHUB_ENV"
              echo "CONTAINER_NAME=fips-node-next"  >> "$GITHUB_ENV"
              echo "UDP_PORT=2122"                 >> "$GITHUB_ENV"
              echo "TCP_PORT=444"                  >> "$GITHUB_ENV"
              echo "TUN_NAME=fips1"                >> "$GITHUB_ENV"
              echo "DNS_ENABLED=false"             >> "$GITHUB_ENV"
              echo "ENTRYPOINT_MODE=fips-only"     >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unknown variant: ${{ matrix.variant }}"; exit 1 ;;
          esac

      - name: Resolve peers for ${{ matrix.name }}/${{ matrix.variant }}
        run: |
          # Per (host/variant) static peers, comma-separated as npub|ip|port.
          # Default: none. Add a case branch here to seed bootstrap peers.
          case "${{ matrix.name }}/${{ matrix.variant }}" in
            *) PEERS="" ;;
          esac
          echo "PEERS=$PEERS" >> "$GITHUB_ENV"

      - name: Validate required secrets are present
        run: |
          missing=()
          [ -z "${DEPLOY_HOST}"  ] && missing+=("$HOST_VAR")
          [ -z "${DEPLOY_USER}"  ] && missing+=("$USER_VAR")
          [ -z "${NSEC_VALUE}"   ] && missing+=("$NSEC_SECRET")
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing+=("SSH_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets/vars in environment '${{ inputs.environment || 'production' }}':"
            for s in "${missing[@]}"; do echo "::error::  - $s"; done
            echo "::error::Set them under Settings → Environments → ${{ inputs.environment || 'production' }} (Secrets and/or Variables)."
            exit 1
          fi

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ matrix.variant }}
          path: /tmp

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Generate fips config
        run: |
          if [ -z "$NSEC_VALUE" ]; then
            echo "Error: nsec is empty" >&2
            exit 1
          fi

          CFG="/tmp/${CONTAINER_NAME}.yaml"

          # Bind UDP/TCP to the public IP (not 0.0.0.0) so fips can publish a
          # concrete reachable endpoint in its Nostr advert. Requires the
          # container to use --network host (see "Deploy on remote server").
          {
            echo "node:"
            echo "  identity:"
            echo "    nsec: \"${NSEC_VALUE}\""
            echo "  limits:"
            echo "    max_peers: 512"
            echo "  discovery:"
            echo "    nostr:"
            echo "      enabled: true"
            echo "      advertise: true"
            echo ""
            echo "tun:"
            echo "  enabled: true"
            echo "  name: ${TUN_NAME}"
            echo "  mtu: 1280"
            echo ""
            echo "dns:"
            echo "  enabled: ${DNS_ENABLED}"
            echo "  bind_addr: \"127.0.0.1\""
            echo ""
            echo "transports:"
            echo "  udp:"
            echo "    bind_addr: \"${DEPLOY_HOST}:${UDP_PORT}\""
            echo "    mtu: 1472"
            echo "    advertise_on_nostr: true"
            echo "    public: true"
            echo "  tcp:"
            echo "    bind_addr: \"${DEPLOY_HOST}:${TCP_PORT}\""
            echo "    advertise_on_nostr: true"
          } > "$CFG"

          if [ -n "$PEERS" ]; then
            echo "" >> "$CFG"
            echo "peers:" >> "$CFG"
            IFS=',' read -ra PEER_LIST <<< "$PEERS"
            for peer in "${PEER_LIST[@]}"; do
              peer=$(echo "$peer" | xargs)
              [ -z "$peer" ] && continue
              IFS='|' read -r npub ip port <<< "$peer"
              echo "  - npub: \"${npub}\"" >> "$CFG"
              echo "    addresses:" >> "$CFG"
              echo "      - transport: udp" >> "$CFG"
              echo "        addr: \"${ip}:${port}\"" >> "$CFG"
            done
          fi

          echo "Generated ${CONTAINER_NAME} config (nsec redacted):"
          grep -v "nsec:" "$CFG"

      - name: Copy files to remote server
        run: |
          scp /tmp/fips-node.tar.gz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/fips-node-${IMAGE_TAG}.tar.gz"
          scp "/tmp/${CONTAINER_NAME}.yaml" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/${CONTAINER_NAME}.yaml"

      - name: Deploy on remote server
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- \
            "$IMAGE_TAG" "$CONTAINER_NAME" "$ENTRYPOINT_MODE" << 'REMOTE_SCRIPT'
          set -euo pipefail

          IMAGE_NAME="fips-node"
          IMAGE_TAG="$1"
          CONTAINER_NAME="$2"
          ENTRYPOINT_MODE="$3"
          CONFIG_DIR="/etc/fips"
          TARBALL="/tmp/fips-node-${IMAGE_TAG}.tar.gz"
          CONFIG_SRC="/tmp/${CONTAINER_NAME}.yaml"

          echo "--- [$CONTAINER_NAME] Stopping existing container (if any)..."
          sudo docker stop "$CONTAINER_NAME" 2>/dev/null || true
          sudo docker rm   "$CONTAINER_NAME" 2>/dev/null || true

          echo "--- Removing old image (if any)..."
          sudo docker rmi "$IMAGE_NAME:$IMAGE_TAG" 2>/dev/null || true

          echo "--- Loading new image..."
          sudo docker load < "$TARBALL"
          sudo rm -f "$TARBALL"

          echo "--- Installing config..."
          sudo mkdir -p "$CONFIG_DIR"
          sudo cp "$CONFIG_SRC" "$CONFIG_DIR/${CONTAINER_NAME}.yaml"
          sudo rm -f "$CONFIG_SRC"

          echo "--- Starting container..."
          # --network host: required so the container can bind directly to
          # the host's public IP (fips needs a concrete reachable address
          # for its Nostr advert; bridge networking would only expose the
          # container's private IP). Drops the need for -p port mappings.
          # Note: --sysctl net.ipv6.conf.* is not allowed with --network host
          # (those sysctls live in the network namespace). The host's IPv6
          # setting now applies directly; ensure IPv6 is enabled on the host
          # if needed (sysctl net.ipv6.conf.all.disable_ipv6=0).
          run_args=(
            -d
            --name "$CONTAINER_NAME"
            --restart unless-stopped
            --cap-add NET_ADMIN
            --device /dev/net/tun:/dev/net/tun
            --network host
            -v "$CONFIG_DIR/${CONTAINER_NAME}.yaml:/etc/fips/fips.yaml:ro"
          )
          if [ "$ENTRYPOINT_MODE" = "fips-only" ]; then
            # next runs alongside master under --network host: skip the image's
            # default entrypoint (dnsmasq + iperf3 + http.server + fips) and run
            # fips alone so the shared ports 53/5354/5201/8000 don't collide.
            sudo docker run "${run_args[@]}" \
              --entrypoint /bin/bash \
              "$IMAGE_NAME:$IMAGE_TAG" \
              -c "exec fips --config /etc/fips/fips.yaml"
          else
            sudo docker run "${run_args[@]}" "$IMAGE_NAME:$IMAGE_TAG"
          fi

          echo "--- Container started:"
          sudo docker ps --filter "name=$CONTAINER_NAME" --format "  {{.Names}}  {{.Status}}  {{.Ports}}"
          REMOTE_SCRIPT

      - name: Verify deployment
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo docker ps --filter 'name=${CONTAINER_NAME}' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"

  # ---------------------------------------------------------------------------
  # Job 4 – Save a per-variant deployment marker so future scheduled runs
  # short-circuit on an unchanged branch SHA. Only runs if every deploy leg
  # succeeded (if: success()), so a failed host blocks marking the variant.
  # ---------------------------------------------------------------------------
  save-marker:
    name: Save ${{ matrix.variant }} marker
    runs-on: ubuntu-latest
    needs: [resolve, deploy]
    if: needs.resolve.outputs.build_matrix != '[]' && success()
    strategy:
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}
    steps:
      - name: Write marker file
        run: |
          mkdir -p .deployed-marker
          echo "${{ matrix.variant }} ${{ matrix.sha }} deployed at $(date -u +%FT%TZ)" \
            > .deployed-marker/info

      - name: Save cache
        uses: actions/cache/save@v5
        with:
          path: .deployed-marker
          key: fips-deployed-${{ matrix.variant }}-${{ matrix.sha }}
